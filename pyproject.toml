[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "company-embedding-benchmark"
version = "0.1.0"
description = "Reproducible CPU embedding benchmark for semantic company screening"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.4.3",
  "psutil==7.1.3",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-cov>=6,<8"]
transformers = ["torch==2.9.1", "transformers==5.3.0", "sentence-transformers==5.3.0", "einops==0.8.2", "safetensors==0.8.0", "accelerate==1.12.0"]
onnx = ["onnxruntime==1.24.4"]

[project.scripts]
embedding-bench = "embedding_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_bench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

